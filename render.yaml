# https://render.com Blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: digital-memory-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./digital_memory.db
      - key: CORS_ORIGINS
        # После деплоя фронта замените на ваш Pages URL
        value: https://yumewamouii.github.io
      - key: PUBLIC_FRONTEND_URL
        value: https://yumewamouii.github.io/digital-memory
      - key: PYTHON_VERSION
        value: "3.12.7"
